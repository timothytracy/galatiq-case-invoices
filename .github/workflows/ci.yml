# Samples, unseen, and ordered replay call scripts/eval.py directly.
# A missing file fails the step. A present file still exits 1 when the
# score is short of perfect. No API key is used.
# Pending approval: tools-on recordings will be added after the ledger
# audit-tool change merges, because it changes the tools-on prompt and
# tool list. Those two steps skip only while their file is absent.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python3 -m pip install -r requirements.txt
      - name: Create the inventory database
        run: python3 setup_db.py
      - name: Tests
        run: python3 -m pytest -q
      - name: Replay sample invoices
        run: python3 scripts/eval.py --replay recordings/samples.jsonl
      - name: Replay unseen invoices
        run: python3 scripts/eval.py --invoices data/extra_invoices --answer-key data/extra_answer_key.json --replay recordings/unseen.jsonl
      - name: Replay sample invoices with tools
        run: |
          if [ ! -f recordings/samples_tools.jsonl ]; then
            echo "skip: recordings/samples_tools.jsonl is not in the repo yet"
            exit 0
          fi
          python3 scripts/eval.py --replay recordings/samples_tools.jsonl
        env:
          XAI_TOOLS: "1"
      - name: Replay unseen invoices with tools
        run: |
          if [ ! -f recordings/unseen_tools.jsonl ]; then
            echo "skip: recordings/unseen_tools.jsonl is not in the repo yet"
            exit 0
          fi
          python3 scripts/eval.py --invoices data/extra_invoices --answer-key data/extra_answer_key.json --replay recordings/unseen_tools.jsonl
        env:
          XAI_TOOLS: "1"
      - name: Replay the ordered ledger scenario
        run: python3 scripts/eval.py --ordered --replay recordings/ordered.jsonl
