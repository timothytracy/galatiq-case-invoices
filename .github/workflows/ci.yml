# Replay steps call scripts/eval.py directly. A missing file fails the
# step. A present file still exits 1 when the score is short of perfect,
# except for a row the answer key lists as a known_miss, which is printed as
# KNOWN_MISS and counted on the score line. No API key is used.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python3 -m pip install -r requirements-dev.txt
      - name: Lint
        run: python3 -m ruff check .
      - name: Tests
        run: python3 -m pytest -q
      - name: Setup wrapper still creates a missing inventory database
        run: python3 setup_db.py "$RUNNER_TEMP/inventory.db"
      - name: Replay sample invoices
        run: python3 scripts/eval.py --replay recordings/samples.jsonl
      - name: Replay unseen invoices
        run: python3 scripts/eval.py --invoices data/extra_invoices --answer-key data/extra_answer_key.json --replay recordings/unseen.jsonl
      - name: Replay the ordered ledger scenario
        run: python3 scripts/eval.py --ordered --replay recordings/ordered.jsonl
      - name: Replay the loop set
        run: python3 scripts/eval.py --invoices data/loop_invoices --answer-key data/loop_answer_key.json --replay recordings/loop.jsonl
      - name: Replay the fraud set
        run: python3 scripts/eval.py --invoices data/fraud_invoices --answer-key data/fraud_answer_key.json --replay recordings/fraud.jsonl
      - name: Replay the pass-list set
        run: python3 scripts/eval.py --invoices data/passlist_invoices --answer-key data/passlist_answer_key.json --replay recordings/passlist.jsonl
      - name: Replay the judgment set
        run: python3 scripts/eval.py --invoices data/judgment_invoices --answer-key data/judgment_answer_key.json --replay recordings/judgment.jsonl
