# Replay steps call scripts/eval.py directly. A missing tools-off file
# fails the step. recordings/ordered_tools.jsonl is the tools-enabled
# ordered recording. That step skips, with a note, until the file is
# committed. A present file still exits 1 when the score is short of
# perfect. No API key is used.

name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python3 -m pip install -r requirements.txt
      - name: Create the inventory database
        run: python3 setup_db.py
      - name: Tests
        run: python3 -m pytest -q
      - name: Replay sample invoices
        run: python3 scripts/eval.py --replay recordings/samples_tools.jsonl
      - name: Replay unseen invoices
        run: python3 scripts/eval.py --invoices data/extra_invoices --answer-key data/extra_answer_key.json --replay recordings/unseen_tools.jsonl
      - name: Replay sample invoices with tools off
        run: python3 scripts/eval.py --replay recordings/samples.jsonl
        env:
          XAI_TOOLS: "0"
      - name: Replay unseen invoices with tools off
        run: python3 scripts/eval.py --invoices data/extra_invoices --answer-key data/extra_answer_key.json --replay recordings/unseen.jsonl
        env:
          XAI_TOOLS: "0"
      - name: Replay the ordered ledger scenario
        run: |
          if [ ! -f recordings/ordered_tools.jsonl ]; then
            echo "skip: recordings/ordered_tools.jsonl is not recorded yet. This step replays the ordered scenario with audit tools enabled. It runs once that file is committed."
            exit 0
          fi
          python3 scripts/eval.py --ordered --replay recordings/ordered_tools.jsonl
      - name: Replay the ordered ledger scenario with tools off
        run: python3 scripts/eval.py --ordered --replay recordings/ordered.jsonl
        env:
          XAI_TOOLS: "0"
